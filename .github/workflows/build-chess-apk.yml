
name: Build Chess Alomgir Tournament APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Chess_Alomgir_Tournament_Project-1.zip'
      - '.github/workflows/build-chess-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q Chess_Alomgir_Tournament_Project-1.zip -d project

      - name: Install Android API 37
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-37"

      - name: Update compileSdk to 37
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path("project").rglob("build.gradle"))
          files += list(Path("project").rglob("build.gradle.kts"))

          patterns = [
              (r'(compileSdk\s*=\s*)36\b', r'\g<1>37'),
              (r'(compileSdk\s+)36\b', r'\g<1>37'),
              (r'(compileSdkVersion\s*\(?\s*)36(\s*\)?)', r'\g<1>37\g<2>'),
          ]

          changed = []
          for path in files:
              old = path.read_text()
              new = old
              for pattern, replacement in patterns:
                  new = re.sub(pattern, replacement, new)
              if new != old:
                  path.write_text(new)
                  changed.append(str(path))

          if not changed:
              raise SystemExit("compileSdk 36 was not found")

          print("Updated:", changed)
          PY

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Alomgir-Tournament-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

